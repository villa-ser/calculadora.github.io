<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser Gestión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="gnc-card" id="mainHeader">
        <p class="gnc-label">Plataforma Oficial</p>
        <h1 class="gnc-title">Villaser Gestión</h1>
        <div class="gnc-status">
            <span class="status-dot"></span>
            <span class="status-text">Sistema Activo</span>
        </div>
    </header>

    <!-- PANTALLA DE INICIO / ACCESO -->
    <main id="accessScreen" class="glass-container">
        <h2>Bienvenido</h2>
        <button id="enterBtn" class="primary-action-btn" onclick="iniciarAcceso()">Ingresar a Calculadora</button>
    </main>

    <!-- PANTALLA DE BIENVENIDA (ANIMACIÓN) -->
    <section id="welcomeScreen" class="hidden">
        <h2 class="welcome-text">¡BIENVENIDO!</h2>
    </section>

    <!-- INTERFAZ PRINCIPAL DE LA APP -->
    <section id="appScreen" class="hidden">
        <!-- Botón Desplegable del Menú -->
        <button id="menuToggleBtn" class="glass-btn primary-btn" onclick="toggleMenu()">MENÚ PRINCIPAL</button>

    <!-- Cuadrícula de Botones de Módulos -->
    <nav id="menuGrid" class="grid-container hidden">
        <button class="grid-btn" id="btnInecuaciones">Inecuaciones</button>
        <button class="grid-btn" id="btnCaidadeTension">Caida de Tension</button>
        <button class="grid-btn" id="btnIntensidadadmisible">Intensidad admisible</button>
        <button class="grid-btn" id="btnPotenciaMotoresCapacitores">Potencia Motores Capacitores</button>
        <button class="grid-btn" id="btnVerificacionCortocircuito">Verificacion Intensidad de Cortocircuito</button>
        <button class="grid-btn" id="btnBalancetermicoenTableros">Balance termico en Tableros</button>
        <button class="grid-btn" id="btnCurvatermica">Curva termica</button>
        <button class="grid-btn" id="btnBancodeCapacitores">Banco de Capacitores</button>
        <button class="grid-btn" id="btnDiagnosticodeCapacitores">Diagnóstico de Capacitores</button>
        <button class="grid-btn" id="btnCorrientedeCCMinima">Corriente de CC Mínima</button>
        <button class="grid-btn" id="btnReducciondeCCmaxima">Reduccion de CC máxima</button>
        <button class="grid-btn" id="btnMaximaCantidadCables">Máxima cantida de cables en cañería</button>
        <button class="grid-btn" id="btnNuevoModulo">Nuevo Modulo</button>
    </nav>
    </section>

    <script src="script.js"></script>
</body>
</html>
